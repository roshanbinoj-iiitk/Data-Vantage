name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["", address, thread]
    name: backend (${{ matrix.sanitizer || 'release' }})
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libsqlite3-dev curl python3
      - name: Configure
        run: >
          cmake -S backend -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.sanitizer && 'Debug' || 'Release' }}
          -DDV_BUILD_TESTS=ON
          -DDV_SANITIZE=${{ matrix.sanitizer }}
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: API tests
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: backend/tests/test_api.sh build/data-vantage

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: clang-format --dry-run --Werror backend/src/*.cpp backend/include/*.h backend/tests/*.cpp backend/tests/*.h

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
